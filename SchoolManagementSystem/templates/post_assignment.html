<!DOCTYPE html>
<html>
<head>
    <title>Post Assignment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .header-box {
            background: linear-gradient(135deg, #f6c23e, #dda20a);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .card-custom {
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <!-- Header -->
    <div class="header-box shadow mb-4">
        <h3>Post New Assignment</h3>
        <p class="mb-0">Create assignments for your assigned classes</p>
    </div>

    <div class="card shadow card-custom">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- Division -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Select Division</label>
                        <select name="division" class="form-select" required>
                            <option value="">-- Select Division --</option>
                            {% for a in assignments %}
                                <option value="{{ a.division.id }}">
                                    {{ a.division }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Subject -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Select Subject</label>
                        <select name="subject" class="form-select" required>
                            <option value="">-- Select Subject --</option>
                            {% for a in assignments %}
                                <option value="{{ a.subject.id }}">
                                    {{ a.subject.name }} ({{ a.division }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Title -->
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Assignment Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>

                    <!-- Description -->
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" rows="4" class="form-control" required></textarea>
                    </div>

                    <!-- Due Date -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" name="due_date" class="form-control" required>
                    </div>

                </div>

                <button type="submit" class="btn btn-warning">
                    Post Assignment
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
