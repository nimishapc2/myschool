<!DOCTYPE html>
<html>
<head>
    <title>Manage Marks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .header-box {
            background: linear-gradient(135deg, #4e73df, #224abe);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .table thead {
            background-color: #343a40;
            color: white;
        }

        .btn-sm {
            padding: 4px 10px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="header-box shadow mb-4">
        <h3>View & Manage Marks</h3>
    </div>

    <!-- FILTER -->
    <form method="GET" class="row mb-4">

        <div class="col-md-4">
            <select name="division" class="form-select">
                <option value="">All Divisions</option>
                {% for d in divisions %}
                    <option value="{{ d.id }}"
                        {% if selected_division == d.id|stringformat:"s" %}selected{% endif %}>
                        {{ d }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-4">
            <select name="subject" class="form-select">
                <option value="">All Subjects</option>
                {% for s in subjects %}
                    <option value="{{ s.id }}"
                        {% if selected_subject == s.id|stringformat:"s" %}selected{% endif %}>
                        {{ s.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-4">
            <button class="btn btn-primary w-100">Filter</button>
        </div>

    </form>

    <!-- MARKS TABLE -->
    <div class="card shadow">
        <div class="card-body table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Division</th>
                        <th>Subject</th>
                        <th>Exam</th>
                        <th>Marks</th>
                        <th>Max</th>
                        <th width="180">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for mark in marks %}
                    <tr>

                        <form method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="mark_id" value="{{ mark.id }}">

                            <td>{{ mark.student.name }}</td>
                            <td>{{ mark.student.division }}</td>
                            <td>{{ mark.subject.name }}</td>
                            <td>{{ mark.get_exam_display }}</td>

                            <td>
                                <input type="number" step="0.01"
                                       name="marks_obtained"
                                       value="{{ mark.marks_obtained }}"
                                       class="form-control">
                            </td>

                            <td>
                                <input type="number" step="0.01"
                                       name="max_marks"
                                       value="{{ mark.max_marks }}"
                                       class="form-control">
                            </td>

                            <td>
                                <button name="action" value="update"
                                        class="btn btn-success btn-sm">
                                    Update
                                </button>

                                <button name="action" value="delete"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('Delete this mark?');">
                                    Delete
                                </button>
                            </td>

                        </form>

                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="7" class="text-center">
                            No marks found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
