<!DOCTYPE html>
<html>
<head>
    <title>Add Marks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .header-box {
            background: linear-gradient(135deg, #1cc88a, #17a673);
            color: white;
            border-radius: 15px;
            padding: 20px;
        }

        .card-custom {
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <!-- Header -->
    <div class="header-box shadow mb-4">
        <h3>
            <i class="bi bi-pencil-square me-2"></i>
            Add Student Marks
        </h3>
        <p class="mb-0">Enter marks for your assigned students.</p>
    </div>

    <div class="card shadow-sm card-custom">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- Student -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Select Student</label>
                        <select name="student" class="form-select" required>
                            <option value="">-- Select Student --</option>
                            {% for student in students %}
                                <option value="{{ student.id }}">
                                    {{ student.name }} ({{ student.division }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Subject -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Select Subject</label>
                        <select name="subject" class="form-select" required>
                            <option value="">-- Select Subject --</option>
                            {% for a in assignments %}
                                <option value="{{ a.subject.id }}">
                                    {{ a.subject.name }} ({{ a.division }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Exam Name -->
                    <!-- Exam -->
<!-- Exam -->
<div class="col-md-6 mb-3">
    <label class="form-label">Select Exam</label>
    <select name="exam" class="form-select" required>
        <option value="">-- Select Exam --</option>
        {% for value, label in exam_choices %}
            <option value="{{ value }}">
                {{ label }}
            </option>
        {% endfor %}
    </select>
</div>



                    <!-- Marks Obtained -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Marks Obtained</label>
                        <input type="number" step="0.01" name="marks_obtained" class="form-control" required>
                    </div>

                    <!-- Max Marks -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Max Marks</label>
                        <input type="number" step="0.01" name="max_marks" class="form-control" required>
                    </div>

                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save me-1"></i> Save Marks
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
