<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<div class="container mt-4">

    <!-- Back Button -->
    <div class="mb-3">
        <a href="/admin-dashboard/" class="btn btn-secondary">
            ⬅ Back to Dashboard
        </a>
    </div>

    <h3 class="mb-4">📋 Mark Attendance</h3>

    <!-- FILTER SECTION -->
    <div class="card shadow rounded-4 mb-4">
        <div class="card-body">
            <form method="GET">
                <div class="row g-3">

                    <div class="col-md-5">
                        <select name="class" class="form-select" required>
                            <option value="">Select Class</option>
                            {% for cls in classes %}
                                <option value="{{ cls.id }}">
                                    {{ cls.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-5">
                        <select name="division" class="form-select" required>
                            <option value="">Select Division</option>
                            {% for div in divisions %}
                                <option value="{{ div.id }}">
                                    {{ div.school_class.name }} - {{ div.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-primary w-100">
                            Load
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>


    {% if students %}

    <form method="POST">
        {% csrf_token %}

        <input type="hidden" name="class" value="{{ request.GET.class }}">
        <input type="hidden" name="division" value="{{ request.GET.division }}">

        <div class="card shadow rounded-4">
            <div class="card-header bg-success text-white d-flex justify-content-between">
                <span>Student List</span>

                <div>
                    <input type="checkbox" onclick="toggleAll(this)">
                    <label> Tick All</label>
                </div>
            </div>

            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Roll</th>
                            <th>Name</th>
                            <th>Present</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ student.name }}</td>
                            <td>
                                <input type="checkbox"
                                       name="student_{{ student.id }}">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>

            <div class="card-footer text-end">
                <button class="btn btn-success">
                    💾 Save Attendance
                </button>
            </div>
        </div>

    </form>

    {% endif %}

</div>


<script>
function toggleAll(source) {
    const checkboxes = document.querySelectorAll('input[type="checkbox"][name^="student_"]');
    checkboxes.forEach(cb => cb.checked = source.checked);
}
</script>

</body>
</html>
