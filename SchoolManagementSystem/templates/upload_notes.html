<!DOCTYPE html>
<html>
<head>
    <title>Upload Notes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .header-box {
            background: linear-gradient(135deg, #36b9cc, #1f8ea5);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .card-custom {
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="header-box shadow mb-4">
        <h3>Upload Study Notes</h3>
        <p class="mb-0">Upload PDF or Word documents for your class</p>
    </div>

    <div class="card shadow card-custom">
        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row">

                    <!-- Division -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Select Division</label>
                        <select name="division" class="form-select" required>
                            <option value="">-- Select Division --</option>
                            {% for a in assignments %}
                                <option value="{{ a.division.id }}">
                                    {{ a.division }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Subject -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Select Subject</label>
                        <select name="subject" class="form-select" required>
                            <option value="">-- Select Subject --</option>
                            {% for a in assignments %}
                                <option value="{{ a.subject.id }}">
                                    {{ a.subject.name }} ({{ a.division }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Lesson Number -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Lesson Number</label>
                        <input type="text" name="lesson_number"
                               class="form-control"
                               placeholder="Eg: Lesson 1 / Chapter 3"
                               required>
                    </div>

                    <!-- Title -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title"
                               class="form-control"
                               required>
                    </div>

                    <!-- File Upload -->
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Upload File (PDF / Word)</label>
                        <input type="file" name="file"
                               class="form-control"
                               accept=".pdf,.doc,.docx"
                               required>
                    </div>

                </div>

                <button type="submit" class="btn btn-info text-white">
                    Upload Notes
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
