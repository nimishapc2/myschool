<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Notes</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            min-height: 100vh;
        }

        .notes-card {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .table thead {
            background-color: #4e73df;
            color: white;
        }

        .table tbody tr:hover {
            background-color: #f8f9fc;
            transition: 0.3s;
        }

        .download-btn {
            border-radius: 30px;
            padding: 5px 15px;
        }

        .page-title {
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="card notes-card p-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="page-title text-primary">
                <i class="bi bi-journal-bookmark-fill"></i> Download Notes
            </h3>
        </div>

        <!-- Responsive Table -->
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>📘 Subject</th>
                        <th>📖 Lesson</th>
                        <th>📝 Title</th>
                        <th class="text-center">⬇ Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for note in notes %}
                    <tr>
                        <td class="fw-semibold">{{ note.subject.name }}</td>
                        <td>Lesson {{ note.lesson_number }}</td>
                        <td>{{ note.title }}</td>
                        <td class="text-center">
                            <a href="{{ note.file.url }}" 
                               class="btn btn-success btn-sm download-btn">
                                <i class="bi bi-download"></i> Download
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">
                            <i class="bi bi-exclamation-circle"></i> No notes available yet.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
