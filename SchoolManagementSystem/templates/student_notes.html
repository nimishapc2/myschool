<html>

<body>
<div class="container mt-4">
    <h4>📚 Download Notes</h4>

    <table class="table table-striped mt-3">
        <tr>
            <th>Subject</th>
            <th>Lesson</th>
            <th>Title</th>
            <th>Download</th>
        </tr>

        {% for note in notes %}
        <tr>
            <td>{{ note.subject.name }}</td>
            <td>{{ note.lesson_number }}</td>
            <td>{{ note.title }}</td>
            <td>
                <a href="{{ note.file.url }}" class="btn btn-success btn-sm">
                    Download
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>


</body>
</html>
